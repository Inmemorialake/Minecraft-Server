# Servidor de Minecraft Fabric 26.3 para la Raspberry Pi 4B
# Ubicación prevista: /mnt/datos/apps/minecraft/
# Docs de la imagen: https://docker-minecraft-server.readthedocs.io

services:
  minecraft:
    # java25 = lo mismo que usa "latest" hoy, pero fijado para que una
    # actualización de la imagen no cambie la versión de Java sin avisar
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    # Tiempo para que el servidor guarde el mundo antes de que Docker lo mate
    stop_grace_period: 1m
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TZ: America/Bogota

      # --- Versión y loader ---
      TYPE: FABRIC
      VERSION: "26.3"

      # --- Mods (solo los del lado del servidor) ---
      # Se descargan solos de Modrinth al arrancar, filtrados por 26.3 + Fabric
      # c2me-fabric:alpha = acepta builds alpha, que es como C2ME suele publicar
      # scalablelux? = opcional: si no hay versión para 26.3, solo avisa en el log
      MODRINTH_PROJECTS: |
        fabric-api
        lithium
        ferrite-core
        chunky
        c2me-fabric:alpha
        scalablelux?
      MODRINTH_DOWNLOAD_DEPENDENCIES: required

      # --- Memoria y JVM ---
      # 2.5 GB: deja espacio en la Pi para el sistema y el backend de EcoBytes
      MEMORY: 2560M
      USE_AIKAR_FLAGS: "true"

      # --- Rendimiento (lo que más alivia la CPU de la Pi) ---
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6

      # --- Cuentas ---
      # Sin verificación con Mojang: permite cuentas sin premium.
      # OJO: cualquiera que llegue al servidor puede entrar con cualquier
      # nombre (incluido el de un operador). Seguro solo mientras el puerto
      # NO esté expuesto a internet (acceso únicamente por Tailscale/LAN).
      ONLINE_MODE: "FALSE"
      # Las cuentas sin premium no tienen claves de chat firmadas por Mojang;
      # sin esto, el servidor las expulsa al conectarse o al chatear
      ENFORCE_SECURE_PROFILE: "FALSE"

      # --- Pausa cuando está vacío (nativa desde 1.21.2, default: 60 s) ---
      # Descomentar mientras Chunky pregenera, para que no se pause sin jugadores
      # PAUSE_WHEN_EMPTY_SECONDS: 0

      # --- Mundo ---
      # La seed solo se aplica al CREAR un mundo; cambiarla no afecta uno existente.
      # Para usarla en un mundo nuevo sin borrar el actual, cambiar también LEVEL
      # (nombre de la carpeta dentro de data/, por defecto "world").
      # SEED: ""
      # LEVEL: world

      # --- Partida ---
      MOTD: "Servidor de Gerardo"
      DIFFICULTY: normal
      MAX_PLAYERS: 5
    volumes:
      - ./data:/data